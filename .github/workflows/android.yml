name: android

# 注意：本 workflow 计划作为 required status check，因此 pull_request 触发**不加 paths 过滤**。
# 带 paths 的 workflow 在未命中的 PR 上不会报告状态，required 会永远卡在 Expected，导致无法合并。
# 需要跳过时在 job 内部判断，而不是在触发条件上过滤。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 顺序有讲究：不需要 JDK/SDK 的检查放在最前面。
      # 2026-10-10 的实测教训：环境准备步骤失败时，后面的步骤全部 skipped，
      # 于是"CI 失败"这件事掩盖了"代码检查到底过没过"。先跑便宜的检查，失败也有信号。
      - name: 隐私红线
        run: python3 scripts/check-privacy-guards.py

      - name: 文档一致性（入口漂移 / spec 状态 / CODEOWNERS 空转）
        run: python3 scripts/check-docs.py

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Windows 上提交的文件默认不带 exec 位（本仓库确实出现过 100644 的 gradlew），
      # 缺了它 CI 会在 ./gradlew 上直接 Permission denied。
      - name: 补齐 gradlew 可执行位
        run: chmod +x ./gradlew

      # 不依赖 android-actions/setup-android：该 action 仍在 Node 20 上（被强制跑在 Node 24），
      # 且 2026-10-10 的三次运行都死在它这一步（后续步骤全部 skipped）。
      # runner 镜像自带 SDK 与 cmdline-tools，显式调用 sdkmanager 少一层黑盒，失败信息也更明确。
      - name: 安装 Android SDK 组件
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::找不到 Android SDK（尝试过 ANDROID_SDK_ROOT / ANDROID_HOME / 默认路径 $SDK_ROOT）"
            ls -la /usr/local/lib/ || true
            exit 1
          fi
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::找不到 sdkmanager：$SDKMANAGER"
            ls -la "$SDK_ROOT" || true
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}

      - name: 静态检查 + 单元测试
        run: ./gradlew --console=plain detekt testDebugUnitTest

      - name: 覆盖率硬门禁（domain/prediction、data/security）
        run: ./gradlew --console=plain jacocoTestReport && python3 scripts/check-coverage.py

      - name: 打包调试包（编译冒烟）
        run: ./gradlew --console=plain :app:assembleDebug

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
