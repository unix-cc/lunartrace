name: android

# 注意：本 workflow 计划作为 required status check，因此 pull_request 触发**不加 paths 过滤**。
# 带 paths 的 workflow 在未命中的 PR 上不会报告状态，required 会永远卡在 Expected，导致无法合并。
# 需要跳过时在 job 内部判断，而不是在触发条件上过滤。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 顺序有讲究：不需要 JDK/SDK 的检查放在最前面。
      # 2026-10-10 的实测教训：环境准备步骤失败时，后面的步骤全部 skipped，
      # 于是"CI 失败"这件事掩盖了"代码检查到底过没过"。先跑便宜的检查，失败也有信号。
      - name: 隐私红线
        run: python3 scripts/check-privacy-guards.py

      - name: 文档一致性（入口漂移 / spec 状态 / CODEOWNERS 空转）
        run: python3 scripts/check-docs.py

      - name: 安装 JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Windows 上提交的文件默认不带 exec 位（本仓库确实出现过 100644 的 gradlew），
      # 缺了它 CI 会在 ./gradlew 上直接 Permission denied。
      - name: 补齐 gradlew 可执行位
        run: chmod +x ./gradlew

      # 不依赖 android-actions/setup-android（该 action 仍在 Node 20，已被强制跑在 Node 24）。
      # 为什么要拆成两步：本地读不到 CI 日志（下载日志需要鉴权），能看到的只有"哪一步失败"。
      # 把"定位/下载 cmdline-tools"与"接受许可+安装"拆开，失败时步骤名本身就给出定位信息。
      - name: 准备 Android SDK（定位或下载 cmdline-tools）
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "本地没有 sdkmanager，改为从 dl.google.com 下载 command line tools（$SDK_ROOT）"
            ls -la "$SDK_ROOT" || true
            curl -fsSL -o /tmp/cmdline-tools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            rm -rf /tmp/cmdline-unzip
            mkdir -p /tmp/cmdline-unzip "$SDK_ROOT/cmdline-tools"
            unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-unzip
            mv /tmp/cmdline-unzip/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          fi
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"
          "$SDKMANAGER" --version

      - name: 接受许可并安装 platform-tools / android-34 / build-tools
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:?未设置：上一步应已写入 GITHUB_ENV}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          # 不要写 `yes | sdkmanager --licenses`：带 pipefail 时 yes 会因 SIGPIPE 被 SIGTERM，
          # 整条管道被判失败——把"正常结束"当成错误。用文件喂输入，彻底避开管道。
          printf 'y\n%.0s' $(seq 1 50) > /tmp/android-licenses.txt
          "$SDKMANAGER" --licenses < /tmp/android-licenses.txt > /dev/null
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/libs.versions.toml') }}

      - name: 静态检查 + 单元测试
        run: ./gradlew --console=plain detekt testDebugUnitTest

      - name: 覆盖率硬门禁（domain/prediction、data/security）
        run: ./gradlew --console=plain jacocoTestReport && python3 scripts/check-coverage.py

      - name: 打包调试包（编译冒烟）
        run: ./gradlew --console=plain :app:assembleDebug

      # 让"去哪里弄安装包"变成一个可下载的答案，而不是"你得在本地构建"。
      # debug 包用 debug keystore 签名，可以直接装到手机上（会与本机 Android Studio 的 debug 包互斥）。
      - name: 上传调试安装包
        uses: actions/upload-artifact@v4
        with:
          name: lunartrace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
